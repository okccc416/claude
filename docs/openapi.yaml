openapi: 3.0.3
info:
  title: Address Validation API
  version: "0.4"
  description: |
    地址校验服务（对应 mvp/avmvp/server.py）。请求结构与 Google Address Validation API 相同；响应的字段、取值和含义
    按 Google AV（validateAddress）对齐（mvp/avmvp/intl/google.py）：各国"该有哪些字段"、排版、州 / 省的邮编前缀
    用 Google 的地址格式元数据（mvp/avmvp/intl/address_formats.json），并补全 Google 会补的城市、州 / 省、国家。
    在 Google 字段之外另有扩展字段：原因码（reasons）、置信度（confidence）、候选地址、非地址信息、地址编码。

    覆盖 Google Address Validation 覆盖的全部国家 / 地区（美国除外），外加中东和东南亚，共 45 个市场：
    - 新加坡（SG）：专用引擎，逐门牌验真，带贝叶斯置信度（docs/07、09）
    - A 类（官方地址表逐门牌验真）：澳洲、新西兰、日本、加拿大、墨西哥、巴西、智利、哥伦比亚，以及欧洲 21 国
    - B 类（中东）：阿联酋、沙特；C 类（没有开放地址表）：东南亚 5 国、英国、爱尔兰、瑞典、匈牙利、保加利亚、阿根廷、印度、波多黎各
      道路 / 楼宇 / 片区验真（docs/13）
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/address:validate:
    post:
      summary: 校验一个地址
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateRequest" }
            examples:
              dubai:
                value:
                  address: { regionCode: AE, addressLines: ["Latifa Tower, Ground Floor - Sheikh Zayed Rd"], locality: Dubai }
              sydney:
                value:
                  address: { regionCode: AU, addressLines: ["Unit 2/360 Lonsdale St"], locality: Melbourne, postalCode: "3000" }
                  strictness: BALANCED
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidateResponse" }
        "400":
          description: 请求不合法，或不支持的 regionCode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/address:batchValidate:
    post:
      summary: 批量校验（最多 1,000 条；单条出错只影响该条）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/ValidateRequest" }
      responses:
        "200":
          description: 与 requests 一一对应
          content:
            application/json:
              schema:
                type: object
                properties:
                  responses:
                    type: array
                    items:
                      oneOf:
                        - { $ref: "#/components/schemas/ValidateResponse" }
                        - { $ref: "#/components/schemas/Error" }
                  serverTimeMs: { type: number }
        "400":
          description: requests 缺失、为空或超过 1,000 条
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/markets:
    get:
      summary: 开放的市场及参考数据状态
      responses:
        "200":
          description: 市场列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  markets:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: AE }
                        name: { type: string, example: 阿联酋 }
                        cls: { type: string, enum: [A, B, C] }
                        cities: { type: array, items: { type: string } }
                        available: { type: boolean, description: 参考数据是否已构建 }
                        loaded: { type: boolean, description: 引擎是否已加载到内存 }
  /healthz:
    get:
      summary: 健康检查
      responses:
        "200": { description: ok }
components:
  schemas:
    ValidateRequest:
      type: object
      properties:
        address:
          type: object
          properties:
            regionCode: { type: string, description: "45 个市场（ISO 国家代码，英国写 GB）：SG；A 类 AU DE FR NL CA MX BR CL CO BE LU CH AT IT ES PT DK NO FI EE LV LT PL CZ SK SI HR NZ JP；B 类 AE SA；C 类 MY ID TH VN PH GB IE SE HU BG AR IN PR。缺省 SG。完整列表见 GET /v1/markets" }
            addressLines: { type: array, items: { type: string } }
            locality: { type: string }
            administrativeArea: { type: string }
            postalCode: { type: string }
        text: { type: string, description: 也可以直接传一整段地址文字（代替 address.addressLines） }
        strictness:
          type: string
          enum: [STRICT, BALANCED, LENIENT]
          default: BALANCED
          description: STRICT 更多要求确认；LENIENT 更多直接通过
        confidenceThreshold:
          type: number
          minimum: 0
          maximum: 1
          description: 可选（多市场引擎）。结论是 ACCEPT 但置信度低于此值时改为 CONFIRM（原因码 LOW_CONFIDENCE）；门槛与自动通过率 / 错误率的关系见 mvp/reports/intl_confidence_report.md
        geoResult:
          type: object
          description: >-
            可选（多市场引擎）。geo 服务对同一输入返回的标准门址，格式同 Google 地理编码（{"results": [{"address_components":
            [{"long_name", "types"}], "geometry": {"location": {"lat", "lng"}, "location_type"}}]}），也接受单条结果或结果列表。
            给了就先把 geo 的门址代回输入核对：逐字段一致直接采用（GEO_VERIFIED）；有纠正 / 补全时 CONFIRM；
            门牌 / 道路对不上时改用本引擎的结论，geo 结果列在候选里（GEO_REJECTED）。见 mvp/avmvp/intl/geo_check.py。
            输入写的城镇 / 邮编在试点范围外（原因码 OUTSIDE_COVERAGE）时，改用全国地名 / 邮编表核对 geo 坐标是否在所写城镇附近。
            也接受高德海外地理编码的响应（{"geocodes": [...]}）。regionCode 不在已建参考库的市场里时，带 geoResult 的请求只用
            原文 + 全国地名表核对（原因码 NO_REFERENCE_DATA，metadata.marketClass = none），见 mvp/avmvp/intl/geo_free.py
    ValidateResponse:
      type: object
      properties:
        responseId: { type: string }
        serverTimeMs: { type: number }
        result:
          type: object
          properties:
            verdict:
              type: object
              properties:
                possibleNextAction:
                  type: string
                  enum: [ACCEPT, CONFIRM, FIX, CONFIRM_ADD_SUBPREMISES]
                  description: |
                    ACCEPT 直接通过；CONFIRM 请用户确认（给出候选）；FIX 请用户修改。与 Google 一致，CONFIRM_ADD_SUBPREMISES
                    只用于美国地址：其他国家"地址对但多户楼缺单元号"返回 CONFIRM，并在 missingComponentTypes 里列出 subpremise
                inputGranularity:
                  type: string
                  enum: [SUB_PREMISE, PREMISE, BLOCK, ROUTE, OTHER]
                  description: 输入写到哪一级（只看解析，不代表验证结果）
                validationGranularity:
                  type: string
                  enum: [SUB_PREMISE, PREMISE, BLOCK, ROUTE, OTHER]
                  description: |
                    验证到哪一级。门牌在官方地址表 / 门牌点里 = PREMISE（单元号也登记过 = SUB_PREMISE）；
                    楼宇（商场、写字楼）本身验证到了 = PREMISE；门牌按相邻门牌推算或来自商户地址 = ROUTE（门牌本身没验证）；
                    日本的门牌点是街区（番）级 = BLOCK；只到片区 / 城镇 = OTHER
                geocodeGranularity:
                  type: string
                  enum: [PREMISE, PREMISE_PROXIMITY, BLOCK, ROUTE, OTHER]
                  description: 坐标的精度（PREMISE_PROXIMITY = 接近门牌：推算的门牌点、楼宇点、Plus Code）
                addressComplete: { type: boolean, description: "没有 unresolvedTokens、没有 missingComponentTypes、没有 unexpected 组件" }
                hasUnconfirmedComponents: { type: boolean, description: 有组件没能确认，或有词没能归入任何组件 }
                hasInferredComponents: { type: boolean, description: 有补全的组件（城市、州 / 省、邮编、国家） }
                hasReplacedComponents: { type: boolean }
                hasSpellCorrectedComponents: { type: boolean }
                confidence: { type: number, description: 结论的置信度（同类结论在标注 / 开发数据上的实际正确率，已校准）；只有给出位置时才有 }
                confidenceNote: { type: string, description: 多市场引擎：置信度的来历，如"开发集上同类结论 N 条中位置给对了 M 条" }
                reasons:
                  type: array
                  description: 原因码，如 STREET_SPELL_CORRECTED、POSTCODE_REPLACED、AMBIGUOUS_MULTIPLE_CANDIDATES、ROUTE_NOT_CORROBORATED、LOCATED_BY_PLUS_CODE、LLM_UNVERIFIED
                  items:
                    type: object
                    properties:
                      code: { type: string }
                      message: { type: string }
            address:
              type: object
              properties:
                formattedAddress: { type: string, description: 按 Google 地址元数据里该国的格式排版，末尾接国家名（日文从大到小连写） }
                postalAddress:
                  type: object
                  description: 规范化后的邮寄地址（Google PostalAddress 的字段）
                  properties:
                    regionCode: { type: string }
                    languageCode: { type: string }
                    postalCode: { type: string }
                    administrativeArea: { type: string, description: "州 / 省（只在该国邮寄地址用到时）：NSW、ON、SP、CDMX、MI、東京都" }
                    locality: { type: string }
                    sublocality: { type: string }
                    addressLines: { type: array, items: { type: string } }
                addressComponents:
                  type: array
                  description: 从小到大排列；类型名与 Google 相同
                  items:
                    type: object
                    properties:
                      componentType:
                        type: string
                        example: route
                        description: |
                          subpremise / premise（楼名）/ street_number / route / plus_code / neighborhood /
                          sublocality_level_1 / locality / postal_town（英国）/ administrative_area_level_2（意大利、西班牙的省）/
                          administrative_area_level_1 / postal_code / country
                      componentName:
                        type: object
                        properties:
                          text: { type: string }
                          languageCode: { type: string, description: 输入地址的语言（按文字和该国语种判断） }
                      confirmationLevel:
                        type: string
                        enum: [CONFIRMED, UNCONFIRMED_BUT_PLAUSIBLE, UNCONFIRMED_AND_SUSPICIOUS]
                      inferred: { type: boolean, description: 原文没写、补全的 }
                      replaced: { type: boolean }
                      spellCorrected: { type: boolean }
                      unexpected: { type: boolean, description: 该国邮寄地址里不该有的组件（如阿联酋地址里的邮编） }
                missingComponentTypes:
                  type: array
                  items: { type: string }
                  description: 该国必填（Google 地址元数据的 require）却既不在输入里、也补不出来的组件类型
                unconfirmedComponentTypes: { type: array, items: { type: string } }
                unresolvedTokens: { type: array, items: { type: string }, description: 原文里没能归入任何组件的词 }
            geocode:
              type: object
              nullable: true
              properties:
                location: { type: object, properties: { latitude: { type: number }, longitude: { type: number } } }
                plusCode: { type: object, properties: { globalCode: { type: string } } }
                bounds:
                  type: object
                  description: 道路 / Plus Code 格子 / 片区的范围（门牌点不给）
                  properties:
                    low: { type: object, properties: { latitude: { type: number }, longitude: { type: number } } }
                    high: { type: object, properties: { latitude: { type: number }, longitude: { type: number } } }
                featureSizeMeters: { type: number }
                placeTypes: { type: array, items: { type: string }, example: [street_address] }
            nonAddressInfo:
              type: object
              nullable: true
              description: 从输入里分离出来、没有参与地址解析的内容（各键只在有内容时出现）
              properties:
                phones: { type: array, items: { type: string } }
                emails: { type: array, items: { type: string } }
                urls: { type: array, items: { type: string } }
                poBoxes: { type: array, items: { type: string } }
                orderRefs: { type: array, items: { type: string }, description: "订单号 / 运单号" }
                openingHours: { type: array, items: { type: string }, description: "营业时间（Mo-Fr 9-18 Uhr）" }
                recipients: { type: array, items: { type: string }, description: "收件人（Attn / z. Hd. / A/C 之后的人名）" }
                organizations: { type: array, items: { type: string }, description: "公司名（GmbH / Ltda. / LLC …）" }
                notes: { type: array, items: { type: string }, description: "配送备注" }
                descriptions: { type: array, items: { type: string }, description: "方位描述（第三栋、segunda casa …）" }
                landmarks: { type: array, items: { type: string }, description: "方位描述里的参照物，只用来找楼宇 / 商户" }
                relativeTo: { type: array, items: { type: string }, description: "描述里作为参照物的地址（结论最多 CONFIRM）" }
            codes:
              type: object
              nullable: true
              description: 识别出的地址编码：plus_code、makani（迪拜）、short_address（沙特）、latlng
            candidates:
              type: array
              description: 结论不是 ACCEPT 时的候选地址
              items:
                type: object
                properties:
                  formattedAddress: { type: string }
                  location: { type: object, properties: { latitude: { type: number }, longitude: { type: number } } }
            metadata:
              type: object
              properties:
                business: { type: boolean, description: 匹配上的是商户 / 机构（Google 的 metadata.business） }
                poBox: { type: boolean, description: 输入里有邮政信箱 }
                regionCode: { type: string }
                marketClass: { type: string, enum: [A, B, C, none], description: "none = 没有参考库，只核对 geo 结果" }
                parser: { type: string, description: "rules / crf / hybrid / hybrid+llm" }
    Error:
      type: object
      properties:
        error: { type: string }
